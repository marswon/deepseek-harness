# electron-builder configuration for the DeepSeek Harness desktop shell.
# The app dir ships only the main/preload bundles; the Harness runtime closure
# produced by scripts/stage-runtime.mjs is copied in by afterPack.
appId: com.deepseek.harness
productName: DeepSeek Harness
# Do not derive the Linux executable from the scoped npm package name.
executableName: DeepSeek-Harness
directories:
  output: release
files:
  - lib/**
  - package.json
  # js-yaml is a runtime dependency of electron-updater, but the workspace
  # root also depends on it and electron-builder's collector refuses the
  # duplicate ("cannot find path for dependency"). Copy it verbatim instead:
  # from points at the root install (a pnpm symlink the copier dereferences).
  - from: ../../node_modules/js-yaml
    to: node_modules/js-yaml
# The staged Harness runtime is copied by scripts/after-pack.cjs — the
# extraResources file matcher excludes node_modules even with an explicit
# filter, and the runtime IS a node_modules tree. Staging lives in the OS
# temp dir (stage-runtime.mjs explains why it must stay outside the repo).
afterPack: scripts/after-pack.cjs
# node-pty ships N-API prebuilds that load under any stock Node 22/24;
# there is nothing for electron-builder to rebuild.
npmRebuild: false
asar: true
publish:
  provider: github
  owner: marswon
  repo: deepseek-harness
mac:
  category: public.app-category.developer-tools
  # Space-free artifact names: GitHub rewrites spaces to dots on upload, but
  # latest.yml references the hyphenated form, which 404s the updater.
  artifactName: DeepSeek-Harness-${version}-${arch}.${ext}
  target:
    - dmg
    - zip
  hardenedRuntime: true
  # The release CI passes --config.mac.notarize=true with Apple credentials;
  # local packaging stays unsigned.
  notarize: false
win:
  target:
    - nsis
    - portable
nsis:
  # Per-user one-click install: no UAC, no directory choice, updates never
  # touch admin-writable locations. The assisted installer let users install
  # per-machine under Program Files, and every update then failed to write
  # files there — surfacing a misleading "cannot be closed" prompt from the
  # extraction retry loop.
  oneClick: true
  perMachine: false
  artifactName: DeepSeek-Harness-Setup-${version}.${ext}
portable:
  artifactName: DeepSeek-Harness-${version}.${ext}
linux:
  category: Development
  target:
    - AppImage
    - deb
