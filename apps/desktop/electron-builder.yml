# electron-builder configuration for the DeepSeek Harness desktop shell.
# The app dir ships only the main/preload bundles; the Harness runtime closure
# produced by scripts/stage-runtime.mjs is copied in by afterPack.
appId: com.deepseek.harness
productName: DeepSeek Harness
# Do not derive the Linux executable from the scoped npm package name.
executableName: DeepSeek-Harness
directories:
  output: release
files:
  - lib/**
  - package.json
  # js-yaml is a runtime dependency of electron-updater, but the workspace
  # root also depends on it and electron-builder's collector refuses the
  # duplicate ("cannot find path for dependency"). Copy it verbatim instead:
  # from points at the root install (a pnpm symlink the copier dereferences).
  - from: ../../node_modules/js-yaml
    to: node_modules/js-yaml
# The staged Harness runtime is copied by scripts/after-pack.cjs — the
# extraResources file matcher excludes node_modules even with an explicit
# filter, and the runtime IS a node_modules tree. Staging lives in the OS
# temp dir (stage-runtime.mjs explains why it must stay outside the repo).
afterPack: scripts/after-pack.cjs
# node-pty ships N-API prebuilds that load under any stock Node 22/24;
# there is nothing for electron-builder to rebuild.
npmRebuild: false
asar: true
publish:
  provider: github
  owner: marswon
  repo: deepseek-harness
mac:
  category: public.app-category.developer-tools
  # Space-free artifact names: GitHub rewrites spaces to dots on upload, but
  # latest.yml references the hyphenated form, which 404s the updater.
  artifactName: DeepSeek-Harness-${version}-${arch}.${ext}
  target:
    - dmg
    - zip
  hardenedRuntime: true
  # This release channel currently has no Apple Developer credentials, so both
  # local and CI builds remain ad-hoc signed and are not notarized.
  notarize: false
win:
  target:
    - nsis
    - portable
nsis:
  # Per-user one-click install: no UAC, no directory choice, updates never
  # touch admin-writable locations. The assisted installer let users install
  # per-machine under Program Files, and every update then failed to write
  # files there — surfacing a misleading "cannot be closed" prompt from the
  # extraction retry loop.
  oneClick: true
  perMachine: false
  artifactName: DeepSeek-Harness-Setup-${version}.${ext}
portable:
  artifactName: DeepSeek-Harness-${version}.${ext}
linux:
  category: Development
  # Space-free artifact names, for the same reason as mac (see above).
  artifactName: DeepSeek-Harness-${version}-${arch}.${ext}
  # fpm reads the maintainer from `author`, but rejects a bare name; the deb
  # control file needs `Name <email>`.
  maintainer: DeepSeek Harness <opensource@deepseek.com>
  synopsis: Desktop shell for DeepSeek Harness
  # deb is the primary Ubuntu format: only its maintainer script can install
  # the AppArmor profile that Ubuntu 24.04+ requires to let Electron's
  # sandbox open a user namespace (kernel.apparmor_restrict_unprivileged_userns).
  # An AppImage runs no install script, so it cannot ship that profile and
  # aborts at startup on those releases unless launched with --no-sandbox.
  target:
    - target: deb
      arch:
        - x64
        - arm64
    - target: AppImage
      arch:
        - x64
        - arm64
  # GNOME matches a running window to its launcher by app ID. Electron derives
  # app_id from package.json `desktopName`, so deriving the .desktop filename
  # and StartupWMClass from the same value is what keeps the dash from showing
  # a generic placeholder icon instead of ours.
  syncDesktopName: true
deb:
  # 24.04 renamed these to the 64-bit-time_t `t64` packages, which Provide the
  # old names, so one dependency list covers 22.04 through 26.04. libuuid1 and
  # libsecret-1-0 come from electron-builder's default list; keep them.
  depends:
    - libgtk-3-0
    - libnotify4
    - libnss3
    - libxss1
    - libxtst6
    - xdg-utils
    - libatspi2.0-0
    - libuuid1
    - libsecret-1-0
    # Electron 37 needs a GBM-capable Mesa to start under native Wayland.
    - libgbm1
