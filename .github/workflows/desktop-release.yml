# Package the desktop shell for every supported platform. Runs on pull
# requests touching apps/desktop so packaging regressions surface before
# merge, and publishes artifacts to a GitHub Release from a v-prefixed semver
# tag (electron-updater rejects non-semver tags).
name: Desktop (dsh)

on:
  pull_request:
    paths:
      - 'apps/desktop/**'
      - '.github/workflows/desktop-release.yml'
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      publish:
        description: Upload artifacts to a GitHub Release. Must run from a v-prefixed semver tag.
        required: true
        type: boolean
        default: false

permissions:
  contents: read

env:
  PRIMARY_NODE_VERSION: '24'
  DSH_TELEMETRY_DISABLED: '1'
  PUBLISH_DESKTOP: ${{ github.event_name == 'push' || inputs.publish }}

jobs:
  package:
    name: Package ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: mac-arm64
            runner: macos-14
            script: package:mac:arm64
          - target: mac-x64
            runner: macos-13
            script: package:mac:x64
          - target: win-x64
            runner: windows-2025
            script: package:win
          - target: linux-x64
            runner: ubuntu-24.04
            script: package:linux
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v4
        with:
          dest: ${{ runner.temp }}/setup-pnpm

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.PRIMARY_NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Harness runtime and web UI
        run: pnpm run build

      - name: Package desktop app
        if: ${{ !(startsWith(matrix.target, 'mac-') && env.PUBLISH_DESKTOP == 'true') }}
        shell: ${{ startsWith(matrix.target, 'win-') && 'pwsh' || 'bash' }}
        run: pnpm --filter @deepseek-ai/dsh-desktop run ${{ matrix.script }}
        env:
          GH_TOKEN: ${{ env.PUBLISH_DESKTOP == 'true' && github.token || '' }}

      - name: Package signed and notarized macOS app
        if: ${{ startsWith(matrix.target, 'mac-') && env.PUBLISH_DESKTOP == 'true' }}
        run: pnpm --filter @deepseek-ai/dsh-desktop run ${{ matrix.script }} -- --config.mac.notarize=true
        env:
          GH_TOKEN: ${{ github.token }}
          CSC_LINK: ${{ secrets.MAC_CERTIFICATE_BASE64 }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dsh-desktop-${{ matrix.target }}
          path: apps/desktop/release/
          retention-days: 14
