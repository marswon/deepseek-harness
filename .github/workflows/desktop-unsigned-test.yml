name: Desktop unsigned test

on:
  workflow_dispatch:
  push:
    branches:
      - actions/desktop-0.1.5-unsigned-test

permissions:
  contents: read

jobs:
  package:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build Harness and desktop
        run: pnpm run build && pnpm --filter @deepseek-ai/dsh-desktop run build
      - name: Create unsigned builder config
        shell: bash
        run: |
          cat > apps/desktop/electron-builder.unsigned.cjs <<'EOF'
          const { join } = require('node:path')
          const root = join(__dirname, '..', '..')
          module.exports = {
            appId: 'com.deepseek.harness.test',
            productName: 'DeepSeek Harness',
            artifactName: 'deepseek-harness-${version}-${os}-${arch}.${ext}',
            directories: { output: join(__dirname, 'release-unsigned') },
            asar: true,
            files: ['lib/*.js', 'lib/*.cjs', 'renderer/**/*', 'package.json'],
            extraResources: [
              { from: join(root, 'apps/desktop/.desktop-build/development/runtime'), to: 'runtime' },
              { from: join(root, 'apps/desktop/.desktop-build/development/seed'), to: 'seed' },
            ],
            mac: {
              category: 'public.app-category.developer-tools',
              identity: null,
              forceCodeSigning: false,
              hardenedRuntime: false,
              notarize: false,
              target: ['dir'],
            },
            publish: null,
          }
          EOF
          mkdir -p apps/desktop/.desktop-build/development/runtime apps/desktop/.desktop-build/development/seed
      - name: Package unsigned directory
        run: pnpm exec electron-builder --config apps/desktop/electron-builder.unsigned.cjs --mac --arm64 --dir --publish never
      - name: Upload unsigned app
        uses: actions/upload-artifact@v4
        with:
          name: dsh-desktop-0.1.5-rc.2-mac-arm64-unsigned
          path: apps/desktop/release-unsigned/
          if-no-files-found: error
          retention-days: 14
